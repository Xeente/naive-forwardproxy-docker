name: Сборка контейнера с Caddy + Naive Forwardproxy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Клонирование репозитория в директорию раннера
        uses: actions/checkout@v4

      - name: Получение тега последнего релиза Naive Forwardproxy
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LATEST_TAG=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/klzgrad/forwardproxy/releases/latest | jq -r '.tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Не удалось получить тег релиза от GitHub API"
            exit 1
          fi
          echo "Обнаруженный тег: $LATEST_TAG"
          echo "release_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Авторизация в реестре контейнеров GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: xeente
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Проверка текущего образа
        id: check_image
        run: |
          IMAGE_NAME="ghcr.io/xeente/naive-forwardproxy-docker"
          TAG="${{ steps.get_tag.outputs.release_tag }}"
          if docker manifest inspect $IMAGE_NAME:$TAG > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Настройка BuildX
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Сборка и пуш образа
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RELEASE_TAG=${{ steps.get_tag.outputs.release_tag }}
          tags: |
            ghcr.io/xeente/naive-forwardproxy-docker:latest
            ghcr.io/xeente/naive-forwardproxy-docker:${{ steps.get_tag.outputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
